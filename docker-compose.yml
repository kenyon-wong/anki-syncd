services:
  anki:
    container_name: anki-syncd
    build:
      context: .
      args:
        ANKI_VERSION: ${ANKI_VERSION}
    image: anki/syncd:v${ANKI_VERSION}
    restart: unless-stopped

    # 环境变量配置
    env_file:
      - ./envs/pub.env    # 公共配置（时区、语言、同步服务器设置等）
      - ./envs/user.env   # 用户认证配置（从 user.example.env 复制并修改）

    # 用户和工作目录设置
    user: anki
    working_dir: /opt/anki.d/sync.d

    # 网络设置
    # ⚠️ 生产环境建议改为 "127.0.0.1:8080:8080/tcp" 并配合反向代理启用 TLS
    network_mode: bridge
    ports:
      - "8080:8080/tcp"

    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    # 系统优化设置
    sysctls:
      - net.ipv4.tcp_ecn=1
      - net.ipv4.tcp_ecn_fallback=1
      - net.ipv4.tcp_dsack=1
      - net.ipv4.tcp_fack=1
      - net.ipv4.tcp_sack=1
      - net.ipv4.conf.all.rp_filter=1
      - net.ipv4.conf.default.rp_filter=1
      - net.ipv4.tcp_keepalive_intvl=15
      - net.ipv4.tcp_keepalive_probes=5
      - net.ipv4.tcp_keepalive_time=75
      - net.ipv4.tcp_fastopen=3
      - net.ipv4.tcp_moderate_rcvbuf=1
      - net.ipv4.tcp_mtu_probing=2
      - net.ipv4.tcp_syncookies=1
      - net.ipv4.tcp_timestamps=1
      - net.ipv4.tcp_window_scaling=1

    # 存储卷设置
    volumes:
      - "./data.d/sync.d:${SYNC_BASE:-/opt/anki.d/sync.d}"
      - "/etc/localtime:/etc/localtime:ro"

    # 健康检查（使用 anki-sync-server 内置 --healthcheck，无需 curl）
    healthcheck:
      test: ["CMD", "anki-sync-server", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # 资源限制（按需调整）
    mem_limit: 512m
    cpus: "1.0"

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"