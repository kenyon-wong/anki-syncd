name: Build the Docker images

on:
  push:
    branches: ["master"]
    paths:
      - Dockerfile
      - .github/version
      - .github/workflows/**
      - envs/**
  pull_request:
    branches: ["master"]
    paths:
      - Dockerfile
      - .github/version
      - .github/workflows/**
      - envs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact_key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact_key: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      REGISTRY: ${{ secrets.GITEA_SERVICE }}
      IMAGE_NAME: ${{ secrets.GITEA_USER }}/anki_syncd
    steps:
      - uses: actions/checkout@v7

      - name: Get Version
        run: |
          if [ ! -f .github/version ]; then
            echo "Error: Version file not found!"
            exit 1
          fi
          version=$(cat .github/version)
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "Anki Releases Version: ${version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USER }}
          password: ${{ secrets.GITEA_TOKEN }}

      # PR 时仅构建验证（push=false，加载到本地 Docker）；非 PR 时推送到架构专用 tag
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ANKI_VERSION=${{ env.VERSION }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.artifact_key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact_key }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ env.VERSION }}-${{ matrix.artifact_key }}
          labels: |
            org.opencontainers.image.title=Anki Sync Server
            org.opencontainers.image.description=Anki Sync Server Docker Image
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/kenyon-wong/anki-syncd

  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request'
    env:
      REGISTRY: ${{ secrets.GITEA_SERVICE }}
      IMAGE_NAME: ${{ secrets.GITEA_USER }}/anki_syncd
    steps:
      - uses: actions/checkout@v7

      - name: Get Version
        run: |
          version=$(cat .github/version)
          echo "VERSION=${version}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USER }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ env.VERSION }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ env.VERSION }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ env.VERSION }}-arm64

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ env.VERSION }}

      # 清理架构专用中间 tag（非关键步骤，失败不影响构建结果）
      - name: Clean up arch-specific tags
        continue-on-error: true
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_USER: ${{ secrets.GITEA_USER }}
        run: |
          package_name="${IMAGE_NAME#*/}"
          for arch in amd64 arm64; do
            echo "Deleting ${package_name}:v${VERSION}-${arch}..."
            curl -fsSL -X DELETE \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "https://${REGISTRY}/api/v1/packages/${GITEA_USER}/container/${package_name}/v${VERSION}-${arch}" \
              && echo "  deleted" || echo "  skipped (not found or unsupported)"
          done